services:
  postgres:
    image: postgres:17-alpine
    container_name: delcom-blog-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: pabwe_p9_blog
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - delcom_blog_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pabwe_p9_blog"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  delcom_blog_data:
